{# Shared KB styles (agent + portal). Plain CSS on purpose: production's bundled
   tailwind.css is not rebuilt on update, so new Tailwind classes may not exist there. #}
<style>
  .kb-card { padding: 2rem; }
  .kb-body { overflow-wrap: break-word; }
  .kb-body img, .kb-body video { max-width: 100%; height: auto; }
  .kb-body iframe { max-width: 100%; }
  .kb-body table { display: block; max-width: 100%; overflow-x: auto; }
  .kb-body pre { max-width: 100%; overflow-x: auto; }

  .kb-attachments { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #f1f5f9; }
  .kb-att {
    display: flex; align-items: center; gap: 0.625rem; margin-bottom: 0.5rem;
    padding: 0.5rem 0.5rem 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;
  }
  .kb-att-icon { width: 1.25rem; height: 1.25rem; color: #dc2626; flex-shrink: 0; }
  .kb-att-name { flex: 1; min-width: 0; font-size: 0.875rem; color: #1e293b; text-decoration: none; overflow-wrap: anywhere; }
  .kb-att-name:hover { color: #00A651; }
  .kb-att-size { display: block; font-size: 0.75rem; color: #94a3b8; }
  .kb-att-btn {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    min-width: 2.25rem; height: 2.25rem; padding: 0 0.75rem; border-radius: 0.5rem;
    border: 1px solid #cbd5e1; color: #334155; background: #fff;
    font-size: 0.8125rem; font-weight: 500; text-decoration: none;
  }
  .kb-att-btn:hover { background: #f8fafc; }
  .kb-att-btn svg { width: 1rem; height: 1rem; }
  .kb-att-btn.icon { padding: 0; }
  .kb-att-open { background: #00A651; border-color: #00A651; color: #fff; }
  .kb-att-open:hover { background: #008f45; }

  @media (max-width: 767px) {
    .kb-layout { flex-direction: column; }
    .kb-sidebar { width: 100% !important; }
    .kb-links { display: flex; flex-wrap: wrap; gap: 0.375rem; }
    .kb-links a { padding: 0.3rem 0.75rem !important; border: 1px solid #e2e8f0; border-radius: 9999px; max-width: 100%; }
  }
  @media (max-width: 640px) {
    .kb-card { padding: 1rem; }
    .kb-wrap { padding-left: 0 !important; padding-right: 0 !important; padding-top: 0 !important; }
    .kb-att-btn { min-width: 2.5rem; height: 2.5rem; }
  }
</style>
